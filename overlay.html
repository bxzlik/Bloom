<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Bloom Overlay</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
:root{
  /* Вес шрифта — копия --fw-bold из src/shared/styles/root.css
     (окно отдельное, стили главного окна сюда не попадают). Меняешь там — меняй тут. */
  --fw-bold:500;
  --ovl-rgb:255,255,255;
  --bg:#1b1b1d;--bg2:#262628;--accent:#fff;--accent-rgb:255,255,255;
  --text:#fff;--text2:#9a9a9a;--muted:#5a5a5a;--radius:14px;
  /* Подложка кнопок на наведении — как `--hover` в overrides-main.css. */
  --hover:rgba(var(--ovl-rgb),.05);
  --font:-apple-system,'SF Pro Display','SF Pro Text','Segoe UI','Roboto',system-ui,sans-serif;
  --ov-op:0.9;--ov-from:-14px;
}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;
  font-family:var(--font);-webkit-font-smoothing:antialiased;}
/* Прозрачные поля окна не реагируют на мышь; интерактивна только сама плашка
   (pointer-events наследуется детьми → кнопки кликабельны). Сам click-through на
   уровне ОС переключает Rust: окно ловит мышь, только когда курсор над плашкой
   (её габарит шлём в `overlay_set_hit_rect`), иначе клики идут насквозь. */
body{display:flex;align-items:center;justify-content:center;pointer-events:none}
/* Курсор вне плашки (окно сейчас click-through). Гасим и её pointer-events:
   события мыши до вебвью не доходят, и без этого CSS-ховер «залипал» бы на
   элементе, под которым курсор был в момент переключения. */
body.nohit .island{pointer-events:none}

/* ── Плашка-«остров» ─────────────────────────────────── */
.island{
  position:relative;overflow:hidden;
  width:380px;height:64px;display:flex;align-items:center;gap:12px;
  padding:8px 18px 8px 8px;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border:1px solid rgba(var(--ovl-rgb),.07);
  border-radius:40px;
  opacity:0;transform:translateY(var(--ov-from)) scale(.96);
  transition:opacity .26s ease,transform .26s cubic-bezier(.22,1,.36,1);
  pointer-events:auto;
}
.island.show{opacity:var(--ov-op);transform:translateY(0) scale(1)}

/* ── Полоса прогресса (по нижней кромке капсулы) ──────────
   Заливка едет `translateX` (композитор), а не `width` (layout каждый кадр), и
   одной длинной анимацией до конца трека — JS в кадре не участвует (см. armProgress).
   Обрезает её отдельная обёртка `-clip`, а не `overflow` самой дорожки: у дорожки
   есть невидимый ::before-«язычок» расширенной зоны клика, и overflow срезал бы его. */
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(var(--ovl-rgb),.12)}
.prog-clip{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.prog-fill{position:absolute;inset:0;background:var(--accent);transform:translateX(-100%);
  will-change:transform}
/* Перематываемый прогресс: курсор + расширенная зона клика (невидимый «язычок»
   вверх над тонкой полоской) + чуть толще на наведении для удобства попадания. */
.prog.seekable{cursor:pointer}
.prog.seekable::before{content:'';position:absolute;left:0;right:0;bottom:0;top:-9px}
.prog.seekable:hover{height:4px}

/* ── Обложка ─────────────────────────────────────────── */
.cover{
  width:48px;height:48px;flex-shrink:0;position:relative;
  border-radius:50%;background:var(--bg);overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
/* Трек без обложки — та же заглушка, что у плейлистов в приложении
   (shared/ui/EmptyCover.tsx): подложка + знак bloom маской по /logo.png. */
.cov-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)}
.cov-empty i{display:block;width:34%;height:34%;min-width:10px;min-height:10px;flex-shrink:0;background-color:var(--text);opacity:.16;-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat}

/* ── Текст ───────────────────────────────────────────── */
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.title-wrap{max-width:100%;width:100%;overflow:hidden}
.title{font-size:14px;font-weight:var(--fw-bold);color:var(--text);
  white-space:nowrap;line-height:1.2;display:inline-block}
@keyframes ov-marquee{0%{transform:translateX(0)}100%{transform:translateX(var(--ov-off,0))}}
.title-wrap.scrolling .title{animation:ov-marquee linear infinite;will-change:transform}
.title-wrap.scrolling:hover .title{animation-play-state:paused}
.artist{font-size:12px;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
/* Hover-marquee строки артистов — порт `useCardMarquee` из приложения: клип
   (.artist) стоит на месте, внутренний бегунок в покое `inline` (иначе не
   работает многоточие), на ховере плашки становится `inline-block` и катится
   на величину переполнения. Кадры — копия `trscroll` из animations.css. */
@keyframes ov-artscroll{0%,10%{transform:translateX(0)}80%,100%{transform:translateX(var(--tr-off,0))}}
.artist>.mq-in{display:inline}
.tra-link{cursor:pointer;transition:color .1s}
.tra-link:hover{color:var(--text);text-decoration:underline}

/* ── Правый слот: эквалайзер (покой) ↔ кнопки (наведение) ──
   Оба лежат в одной grid-ячейке (стопкой), плавный кросс-фейд по :hover. */
.right{display:grid;width:106px;flex-shrink:0;justify-items:end;align-items:center}
.right>*{grid-area:1/1;transition:opacity .18s ease,transform .18s cubic-bezier(.22,1,.36,1)}

/* Эквалайзер — тот же `.bars`, что в приложении на обложках (строки трек-листа,
   очередь, карточки): три полосы-пилюли на полу, у каждой свой кадр и своя
   длительность, поэтому группа не синхронизируется. Порт из library.css +
   animations.css — правишь тут, правь и там, иначе окна разъедутся.
   Анимируется ВЫСОТА в % от --bars-h, а не scaleY: торцы скруглены с обеих
   сторон, а scaleY сплющивает радиус.
   Ручки --bars-* задаются на конкретной поверхности (остров / круг «полосы»);
   [barsSnap] в оверлей не поднимается, так что значения тут фиксированные — как
   и в остальных зеркальных окнах.
   На острове (и в компактном режиме — там та же разметка) полосы крупнее
   строчных 3/2/17 из приложения: правый слот тут просторнее строки трек-листа, и
   строчный размер в нём терялся. Увеличиваем ручками, а не transform:scale —
   масштаб мылит торцы. Ширина в компакте ограничена `.right` (34px). */
.bars{--bars-w:4px;--bars-gap:3px;--bars-h:21px;--bars-r:999px;
  display:flex;gap:var(--bars-gap);align-items:flex-end;height:var(--bars-h);padding-right:6px}
.bars span{width:var(--bars-w);height:44%;flex-shrink:0;background:var(--accent);
  border-radius:var(--bars-r);animation:npBar1 1.7s ease-in-out infinite}
.bars span:nth-child(2){animation-name:npBar2;animation-duration:1.35s;animation-delay:-.5s}
.bars span:nth-child(3){animation-name:npBar3;animation-duration:2s;animation-delay:-1.1s}
@keyframes npBar1{0%,100%{height:44%}24%{height:80%}48%{height:52%}72%{height:90%}88%{height:62%}}
@keyframes npBar2{0%,100%{height:76%}20%{height:46%}42%{height:86%}64%{height:54%}82%{height:72%}}
@keyframes npBar3{0%,100%{height:56%}26%{height:92%}52%{height:42%}74%{height:78%}90%{height:50%}}
/* На паузе полосы просто замирают — без затухания, как в приложении. */
body.paused .bars span{animation-play-state:paused}
/* Плашка спрятана (opacity:0) — глушим её вечные анимации: невидимый элемент
   всё равно анимируется и жжёт кадры. */
.island:not(.show) .bars span{animation-play-state:paused}
.island:not(.show) .title-wrap.scrolling .title{animation-play-state:paused}

.ctrl{display:flex;align-items:center;gap:3px;opacity:0;transform:translateY(4px) scale(.96);pointer-events:none}
.island:hover .bars{opacity:0;transform:translateY(-4px)}
.island:hover .ctrl{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}

.cbtn{
  width:30px;height:30px;flex-shrink:0;border:none;background:none;color:var(--text);
  cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;
  opacity:.82;transition:background .12s,opacity .12s,transform .08s;
}
.cbtn:hover{opacity:1}
.cbtn:active{transform:scale(.92)}
/* Play без заливки: та же плоская кнопка, что и соседи, только крупнее иконка
   (как `play-flat` в трей-попапе). */
.cbtn-play{width:34px;height:34px;background:none;color:var(--text);opacity:1}
.cbtn-play:hover{opacity:1}

/* ── Режим оптимизации ───────────────────────────────────
   Убираем эквалайзер, отключаем бегущую строку (заголовок обрезается «…») и
   прячем полосу прогресса — остаётся статичная плашка, вообще без анимаций в
   покое. Полоса показывается только при наведении. */
body.perf .bars{display:none}
body.perf .title{overflow:hidden;text-overflow:ellipsis;max-width:100%}
body.perf .prog{display:none}
body.perf .island:hover .prog{display:block}
/* Эквалайзера в правом слоте нет — он бы пустовал в покое, поэтому кнопки
   управления держим показанными всегда, а не только на наведении. */
body.perf .ctrl{opacity:1;transform:none;pointer-events:auto}

/* ── Компактный режим ────────────────────────────────────
   Покой: только обложка + эквалайзер (текст схлопнут). Наведение: плашка
   доезжает до полной ширины, проявляются текст и кнопки. Плашка прижата к
   якорному краю окна (классы al/ac/ar ставит JS), с зазором под тень. */
body.compact .island{width:132px;
  transition:width .26s cubic-bezier(.22,1,.36,1),padding .26s cubic-bezier(.22,1,.36,1),gap .26s cubic-bezier(.22,1,.36,1),opacity .26s ease,transform .26s cubic-bezier(.22,1,.36,1)}
/* Компакт + оптимизация: эквалайзера нет — свёрнутая плашка обтягивает обложку
   «кружком» (без зазоров флекса и лишнего паддинга, чтобы не было пустого поля). */
/* padding:7px — чтобы обложка 48px влезла ровно в контент-бокс (64 − 2 рамки −
   2×7 = 48) и была строго по центру, без перекоса из-за border-box. */
body.compact.perf .island{width:64px;padding:7px;gap:0}
body.compact.perf .island:hover{width:380px;padding:8px 18px 8px 8px;gap:12px}
/* Колонку грида фиксируем под ширину слота — иначе она тянется под кнопки
   управления (самый широкий элемент) и эквалайзер уезжает в обрезку. */
body.compact .right{width:34px;grid-template-columns:100%;transition:width .26s cubic-bezier(.22,1,.36,1)}
body.compact.perf .right{width:0}
/* В свёрнутом компакте правый слот схлопнут в ноль — постоянно показанные
   кнопки (perf) вылезли бы поверх обложки. Возвращаем их на hover-поведение. */
body.compact.perf .island:not(:hover) .ctrl{opacity:0;pointer-events:none}
body.compact .info{opacity:0;transition:opacity .12s ease}
body.compact .island:hover{width:380px}
body.compact .island:hover .right{width:106px}
body.compact .island:hover .info{opacity:1;transition:opacity .2s ease .08s}
/* Бегущая строка крутится только в раскрытом состоянии (экономим в покое). */
body.compact .island:not(:hover) .title-wrap.scrolling .title{animation-play-state:paused}
/* Прижатие к якорному краю + зазор под тень (margin масштабируется zoom'ом плашки). */
body.compact.ar{justify-content:flex-end}
body.compact.al{justify-content:flex-start}
body.compact.ac{justify-content:center}
body.compact.ar .island{margin-right:28px}
body.compact.al .island{margin-left:28px}

/* ── Режим ручного размещения ─────────────────────────────
   Вся плашка превращается в drag-ручку: курсор «move», пунктирная рамка-
   подсказка, а кнопки/прогресс не перехватывают перетаскивание. */
body.placing .island{cursor:move;outline:2px dashed var(--accent);outline-offset:3px}
body.placing .island:hover .ctrl,body.placing .ctrl{opacity:0;pointer-events:none}
body.placing .island:hover .bars{opacity:1;transform:none}
body.placing .prog{pointer-events:none}
body.placing .bcenter,body.placing .bcircle-play{pointer-events:none}
/* Живой бейдж с координатами (доли %) во время ручного размещения. */
.place-coords{position:absolute;top:3px;left:50%;transform:translateX(-50%);
  display:none;white-space:nowrap;padding:2px 9px;border-radius:9px;
  font-size:11px;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;letter-spacing:.2px;
  background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(var(--ovl-rgb),.14);
  pointer-events:none;z-index:10}
body.placing .place-coords{display:block}

/* ── Режим «Полоса» ──────────────────────────────────────
   Три отдельных «стеклянных» элемента: круг play/pause слева, полоса с
   названием и прогрессом по центру, круг-визуализатор (эквалайзер) справа.
   Сам .island служит только контейнером (показ/скрытие, drag, масштаб). */
.bar-wrap{display:none}
body.bar .island{background:none;border:none;box-shadow:none;overflow:visible;
  padding:8px;gap:0}
/* В режиме «полоса» прячем штатную раскладку острова. Тонкую `.prog` держим
   скрытой даже в perf-режиме (там островное правило показывает её на hover —
   получался бы второй прогресс-бар поверх заливки центра). */
body.bar .cover,body.bar .info,body.bar .right,body.bar .prog{display:none}
body.bar .island:hover .prog{display:none}
body.bar .bar-wrap{display:flex;align-items:center;gap:8px;width:100%;height:100%}

/* Общий «стеклянный» вид элементов полосы.
   Без backdrop-filter: окно оверлея прозрачное, за этими элементами внутри
   страницы ничего нет — блюр размывал бы пустоту (визуально no-op), но заставлял
   бы вебвью гонять блюр-пасс на каждый кадр анимации внутри (эквалайзер, заливка
   прогресса). «Стекло» здесь целиком даёт градиент + рамка. */
.bcircle{width:48px;height:48px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text);
  background:linear-gradient(180deg,rgba(var(--ovl-rgb),.11),rgba(var(--ovl-rgb),.03));
  border:1px solid rgba(var(--ovl-rgb),.10)}
.bcircle-play{cursor:pointer;opacity:.95;transition:filter .12s,transform .08s}
.bcircle-play:hover{filter:brightness(1.15);opacity:1}
.bcircle-play:active{transform:scale(.92)}

/* Центральная полоса: название по центру, прогресс — заливкой за текстом.
   Лёгкий блик сверху, как на эталонном дизайне. */
.bcenter{position:relative;flex:1;min-width:0;height:48px;overflow:hidden;
  border-radius:24px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(var(--ovl-rgb),.13),rgba(var(--ovl-rgb),.04));
  border:1px solid rgba(var(--ovl-rgb),.12)}
.bcenter::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;
  background:linear-gradient(180deg,rgba(var(--ovl-rgb),.10),rgba(var(--ovl-rgb),0));
  pointer-events:none}
.bcenter.seekable{cursor:pointer}
/* `.bcenter` уже overflow:hidden — своя обёртка-клип заливке не нужна. */
.bcenter-fill{position:absolute;inset:0;transform:translateX(-100%);
  background:var(--accent);opacity:.18;pointer-events:none;will-change:transform}
.bcenter-title{position:relative;z-index:1;padding:0 16px;max-width:100%;
  font-size:14px;font-weight:var(--fw-bold);color:var(--text);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Визуализатор в правом круге — тот же `.bars`, только крупнее: увеличиваем
   ручками --bars-*, а НЕ transform:scale (масштаб мылит торцы полос) — ровно
   как приложение делает на крупных обложках-карточках. Перебиваем островной
   кроссфейд `.island:hover .bars{opacity:0}`, чтобы при наведении на полосу
   визуализатор не гас. */
.bcircle-viz{position:relative;overflow:hidden}
.bcircle-viz .bars{--bars-w:5px;--bars-gap:4px;--bars-h:22px;padding:0}
body.bar .bcircle-viz .bars{opacity:1;transform:none}
/* Оптимизация: анимировать эквалайзер дорого (постоянный repaint), но и убирать
   круг жалко — вместо столбиков показываем в нём статичную обложку трека.
   inset:0 не заезжает на рамку круга, так что «стеклянный» кант остаётся. */
.bcover{display:none;position:absolute;inset:0;
  align-items:center;justify-content:center;color:var(--muted);background:var(--bg)}
.bcover img{width:100%;height:100%;object-fit:cover;display:block}
body.bar.perf .bcover{display:flex}

    /* ===== КОНТРАКТ ОТРИСОВКИ ИКОНОК =====
       То же, что `[data-ico]` в base.css главного окна, но окно отдельное:
       React-реестра здесь нет, иконки вписаны сырыми <svg>, поэтому вес не
       считается, а задан таблицей по размеру. Формула та же:
       sw = clamp(1.5, 27.6/размер, 2.2) — цель 1.15px штриха на экране.
       Зашитые в иконку 1.5 при 12px давали 0.63px, то есть субпиксельную кашу.

       Ограничено 24-й сеткой: бренд-логотипы живут на своих viewBox и под
       правило не попадают. svg со СВОИМ stroke-width — это голые «+»/«×»,
       нарисованные вручную, их вес выверен отдельно. */
    svg[viewBox="0 0 24 24"]:not([stroke-width]):not([data-ink]),
    svg[viewBox="0 0 24 24"]:not([stroke-width]):not([data-ink]) *{stroke-width:var(--ico-sw,1.5);stroke-linecap:round;stroke-linejoin:round}
    /* Залитые контуры Solar (сердце, shuffle, repeat): толщина запечена в
       координатах, stroke-width по ним не работает — вес добирается тонкой
       обводкой ПОВЕРХ заливки. */
    svg[viewBox="0 0 24 24"][data-ink="filled"]{stroke:currentColor;stroke-width:var(--ico-ink,0);stroke-linejoin:round}
    svg[viewBox="0 0 24 24"][width="12"]{--ico-sw:2.2;--ico-ink:.7}
    svg[viewBox="0 0 24 24"][width="13"]{--ico-sw:2.12;--ico-ink:.62}
    svg[viewBox="0 0 24 24"][width="14"]{--ico-sw:1.97;--ico-ink:.47}
    svg[viewBox="0 0 24 24"][width="15"]{--ico-sw:1.84;--ico-ink:.34}
    svg[viewBox="0 0 24 24"][width="16"]{--ico-sw:1.72;--ico-ink:.22}
    svg[viewBox="0 0 24 24"][width="17"]{--ico-sw:1.62;--ico-ink:.12}
    svg[viewBox="0 0 24 24"][width="18"]{--ico-sw:1.53;--ico-ink:.03}
  </style>
</head>
<body>
<div class="island" id="island">
  <div class="cover" id="cover">
    <svg width="22" height="22" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 19a3 3 0 1 1-6 0a3 3 0 0 1 6 0Zm12-2a3 3 0 1 1-6 0a3 3 0 0 1 6 0ZM9 19V8m12 9V6"/><path stroke-linecap="round" d="m15.735 3.755l-4 1.333c-1.32.44-1.98.66-2.357 1.184S9 7.492 9 8.882V12l12-4v-.45c0-2.533 0-3.8-.83-4.398c-.831-.599-2.032-.198-4.435.603Z"/></g></svg>
  </div>
  <div class="info">
    <div class="title-wrap" id="titleWrap"><div class="title" id="title">—</div></div>
    <div class="artist" id="artist"></div>
  </div>
  <div class="right">
    <div class="bars"><span></span><span></span><span></span></div>
    <div class="ctrl">
      <button class="cbtn" id="btnPrev">
        <svg width="17" height="17" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7.34 9.353c-1.787 1.154-1.787 4.14 0 5.294l10.79 6.967c1.736 1.122 3.87-.338 3.87-2.647V5.033c0-2.31-2.134-3.769-3.87-2.648z"/><path stroke-linecap="round" d="M2 5v14"/></g></svg>
      </button>
      <button class="cbtn cbtn-play" id="btnPlay">
        <svg id="ovPlayIcon" width="21" height="21" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M20.409 9.353a2.998 2.998 0 0 1 0 5.294L7.597 21.614C5.534 22.737 3 21.277 3 18.968V5.033c0-2.31 2.534-3.769 4.597-2.648z"/></svg>
      </button>
      <button class="cbtn" id="btnNext">
        <svg width="17" height="17" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16.66 9.353c1.787 1.154 1.787 4.14 0 5.294L5.87 21.614C4.135 22.737 2 21.277 2 18.968V5.033c0-2.31 2.134-3.769 3.87-2.648z"/><path stroke-linecap="round" d="M22 5v14"/></g></svg>
      </button>
    </div>
  </div>
  <div class="prog" id="prog"><div class="prog-clip"><div class="prog-fill" id="progFill"></div></div></div>

  <!-- Раскладка режима «полоса» (показывается при body.bar). -->
  <div class="bar-wrap" id="barWrap">
    <button class="bcircle bcircle-play" id="btnPlayBar">
      <svg id="ovPlayIconBar" width="16" height="16" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M20.409 9.353a2.998 2.998 0 0 1 0 5.294L7.597 21.614C5.534 22.737 3 21.277 3 18.968V5.033c0-2.31 2.534-3.769 4.597-2.648z"/></svg>
    </button>
    <div class="bcenter" id="barCenter">
      <div class="bcenter-fill" id="progFillBar"></div>
      <div class="bcenter-title" id="titleBar">—</div>
    </div>
    <div class="bcircle bcircle-viz">
      <div class="bars"><span></span><span></span><span></span></div>
      <div class="bcover" id="barCover"></div>
    </div>
  </div>
</div>
<div class="place-coords" id="placeCoords"></div>

<script>
(function(){
  'use strict';
  var ti = null;
  var st = { title:'', artist:'', artwork:'', source:null, playing:false, pos:0, dur:0 };
  var pinned = false;
  var hideTimer = null;
  var duration = 4;
  var seekEnabled = false;   // перемотка по прогресс-бару (из настроек)
  var perfMode = false;      // режим оптимизации: без эквалайзера и бегущей строки
  var scrubbing = false;     // идёт ручной скраб — не снапаем позицию из пушей

  function $(id){ return document.getElementById(id); }

  // target = метка окна, а не 'Any': слушатель с 'Any' принимает и адресные
  // emit_to() в ДРУГИЕ окна (см. tauri match_any_or_filter). Broadcast app.emit()
  // помеченный слушатель по-прежнему получает.
  function listenEvent(event, fn){
    try{
      var hid = ti.transformCallback(function(e){ fn(e.payload); });
      ti.invoke('plugin:event|listen', { event: event, target: { kind: 'AnyLabel', label: 'overlay' }, handler: hid });
    }catch(e){ console.warn('[ov] listen', event, e); }
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ── Цвет из обложки (инлайн-порт coverAccent.ts) ──────
  function hslToHex(h, s, l){
    var a = s * Math.min(l, 1 - l);
    function f(n){
      var k = (n + h / 30) % 12;
      var col = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      return Math.round(255 * col).toString(16).padStart(2, '0');
    }
    return '#' + f(0) + f(8) + f(4);
  }

  var lastArt = null;       // последняя обложка, для которой считали цвет
  var coverColors = null;   // { bg, bg2, accent } | null

  // Применить уже посчитанные цвета обложки поверх темы (если есть).
  var _appliedColors = null;
  function applyComputed(){
    if (!coverColors || coverColors === _appliedColors) return;
    _appliedColors = coverColors;
    var r = document.documentElement;
    r.style.setProperty('--bg', coverColors.bg);
    r.style.setProperty('--bg2', coverColors.bg2);
    r.style.setProperty('--accent', coverColors.accent);
  }

  // Посчитать доминантный цвет обложки и окрасить плашку. CORS-tainted/ошибка →
  // откат к цвету темы.
  function applyCoverColor(){
    var src = st.artwork;
    if (src === lastArt) { applyComputed(); return; }
    lastArt = src;
    if (!src){ coverColors = null; applyTheme(); return; }
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try{
        var c = document.createElement('canvas'); c.width = 32; c.height = 32;
        var x = c.getContext('2d'); if (!x){ coverColors = null; applyTheme(); return; }
        x.drawImage(img, 0, 0, 32, 32);
        var d = x.getImageData(0, 0, 32, 32).data;
        var bH = 0, bS = 0, bL = 0, best = -1;
        for (var i = 0; i < d.length; i += 16){
          var r = d[i]/255, g = d[i+1]/255, b = d[i+2]/255;
          var max = Math.max(r,g,b), min = Math.min(r,g,b);
          var l = (max+min)/2;
          var s = max===min ? 0 : (l < 0.5 ? (max-min)/(max+min) : (max-min)/(2-max-min));
          var score = s * (1 - Math.abs(l-0.5)*1.5);
          if (score > best){
            best = score;
            var h = 0;
            if (max !== min){
              if (max===r) h = ((g-b)/(max-min)+6)%6;
              else if (max===g) h = (b-r)/(max-min)+2;
              else h = (r-g)/(max-min)+4;
              h = Math.round(h*60);
            }
            bH = h; bS = s; bL = l;
          }
        }
        // Тёмный доминант для фона + чуть светлее для верха градиента;
        // сочный, но не кислотный акцент для эквалайзера.
        var sBg = Math.min(0.55, bS*0.9);
        var lBg = Math.max(0.10, Math.min(0.20, bL*0.5));
        coverColors = {
          bg:  hslToHex(bH, sBg, lBg),
          bg2: hslToHex(bH, sBg, Math.min(0.30, lBg + 0.07)),
          accent: hslToHex(bH, Math.min(1, bS*1.3), Math.max(0.45, Math.min(0.65, bL))),
        };
        applyComputed();
      } catch(e){ coverColors = null; applyTheme(); }
    };
    img.onerror = function(){ coverColors = null; applyTheme(); };
    img.src = src;
  }

  function parseArtists(s){
    if (!s) return [];
    return String(s).split(/\s*(?:,|;|&|feat\.?|ft\.?|x|×|with|и)\s+/i)
      .map(function(p){ return p.trim(); }).filter(Boolean);
  }

  // Настройки оверлея (прозрачность/масштаб/длительность) — из общих view-префов.
  function applyPrefs(){
    var p = {};
    try{ p = JSON.parse(localStorage.getItem('bloom_view_prefs') || '{}'); }catch(e){}
    var op = typeof p.overlayOpacity === 'number' ? p.overlayOpacity : 90;
    var size = typeof p.overlaySize === 'number' ? p.overlaySize : 100;
    duration = typeof p.overlayDuration === 'number' ? p.overlayDuration : 4;
    seekEnabled = !!p.overlaySeek;
    perfMode = !!p.overlayPerf;
    var pe = $('prog');
    if (pe) pe.classList.toggle('seekable', seekEnabled);
    var bc = $('barCenter');
    if (bc) bc.classList.toggle('seekable', seekEnabled);
    document.documentElement.style.setProperty('--ov-op', Math.max(0, Math.min(100, op)) / 100);
    // Масштаб плашки. Окно Rust ресайзит синхронно по той же доле.
    $('island').style.zoom = Math.max(50, Math.min(160, size)) / 100;

    // Режим оптимизации + компактная плашка (прижатая к якорному краю).
    var compact = p.overlayMode === 'compact';
    var bar = p.overlayMode === 'bar';
    var body = document.body;
    body.classList.toggle('perf', perfMode);
    body.classList.toggle('compact', compact);
    body.classList.toggle('bar', bar);
    var horiz = (typeof p.overlayPos === 'string' ? p.overlayPos.charAt(1) : 'r') || 'r';
    body.classList.toggle('al', compact && horiz === 'l');
    body.classList.toggle('ac', compact && horiz === 'c');
    body.classList.toggle('ar', compact && horiz === 'r');
    // В компакте ширина/обёртка меняются — пересчёт бегущей строки.
    updateMarquee(true);
    // Смена режима может включить/выключить подкраску от обложки.
    applyCoverColor();
    // …и меняет раскладку полосы прогресса — взводим её заново.
    progDirty = true;
    if (islandShown()) armProgress();
    // Масштаб/режим/якорь двигают саму плашку внутри окна — обновляем габарит
    // для сторожа курсора (ResizeObserver ловит не всё: например смену полей).
    if (ti) reportHit();
  }

  // Тема (акцент + фон блока) — из настроек главного окна (как у мини-плеера).
  function applyTheme(){
    // Тема перетирает --bg/--bg2/--accent, так что кэш «цвета обложки уже
    // применены» после неё недействителен (applyComputed зовут следом).
    _appliedColors = null;
    var s = {};
    try{ s = JSON.parse(localStorage.getItem('bloom_settings') || '{}'); }catch(e){}
    var r = document.documentElement;
    if (s.accent){
      var hex = String(s.accent).replace(/\s/g,'');
      r.style.setProperty('--accent', hex);
      // Тинт подложки кнопок (rgba(var(--accent-rgb),.1)) — как в трей-попапе.
      var m = hex.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
      if (m){
        r.style.setProperty('--accent-rgb',
          parseInt(m[1],16) + ',' + parseInt(m[2],16) + ',' + parseInt(m[3],16));
      }
    }
    // Радиус темы («14px») — от него считается скругление кнопок карточки.
    if (s.radius) r.style.setProperty('--radius', s.radius);
    if (typeof s.blockR === 'number' && typeof s.blockG === 'number' && typeof s.blockB === 'number'){
      r.style.setProperty('--bg', 'rgb('+s.blockR+','+s.blockG+','+s.blockB+')');
      var l = function(c){ return Math.min(255, Math.round(c + (255-c)*0.07)); };
      r.style.setProperty('--bg2', 'rgb('+l(s.blockR)+','+l(s.blockG)+','+l(s.blockB)+')');

      // Светлая тема: сюда приходит только цвет блоков, поэтому светлоту
      // считаем на месте (как themeStore.isLightSurface в главном окне) и
      // переключаем цвет полупрозрачной плёнки + шкалу текста.
      var bl = 0.299*(s.blockR/255) + 0.587*(s.blockG/255) + 0.114*(s.blockB/255);
      var lightUI = bl > 0.6;
      r.style.setProperty('--ovl-rgb', lightUI ? '0,0,0' : '255,255,255');
      r.style.setProperty('--text',  lightUI ? '#111111' : '#ffffff');
      r.style.setProperty('--text2', lightUI ? '#555555' : '#9a9a9a');
      r.style.setProperty('--muted', lightUI ? '#8a8a8a' : '#5a5a5a');
    }
  }

  // Артисты — кликабельные чипы (клик → страница артиста в главном окне).
  var _artistKey = null;
  function renderArtist(){
    if (st.artist === _artistKey) return;
    _artistKey = st.artist;
    var parts = parseArtists(st.artist);
    var html = parts.map(function(a){
      return '<span class="tra-link" data-artist="' + esc(a) + '">' + esc(a) + '</span>';
    }).join(', ');
    // Бегунок .mq-in — обёртка для hover-marquee (см. artScroll ниже).
    $('artist').innerHTML = '<span class="mq-in">' + html + '</span>';
    // Курсор мог остаться на плашке (трек сменился сам) — тогда сразу катим
    // новую строку, иначе она замерла бы до следующего захода.
    var isl = $('island');
    if (isl && isl.matches(':hover')) artScrollStart(); else artScrollStop();
  }

  // Прокрутка не влезшей строки артистов, пока курсор на плашке. Пересчитываем
  // на каждом заходе, а не при рендере: ширина плашки меняется от ховера
  // (раскрытие компакта) и масштаба окна.
  var ART_DURATION = 5, ART_MIN_OVERFLOW = 2;
  function artScrollStart(){
    var clip = $('artist'), inner = clip && clip.firstElementChild;
    if (!inner) return;
    var overflow = clip.scrollWidth - clip.clientWidth;
    if (overflow <= ART_MIN_OVERFLOW) return;
    inner.style.display = 'inline-block';
    inner.style.willChange = 'transform';
    inner.style.setProperty('--tr-off', '-' + overflow + 'px');
    inner.style.animation = 'ov-artscroll ' + ART_DURATION + 's linear infinite';
  }
  function artScrollStop(){
    var clip = $('artist'), inner = clip && clip.firstElementChild;
    if (!inner) return;
    inner.style.animation = '';
    inner.style.transform = 'translateX(0)';
    inner.style.display = ''; // → inline, многоточие снова работает
    inner.style.willChange = '';
    inner.style.removeProperty('--tr-off');
  }

  // Бегущая строка как в приложении (MarqueeTitle): бесшовный loop — две копии
  // текста с зазором, сдвиг на (ширина+зазор); зазор 64px, скорость 55 px/с.
  // Замер через скрытый дубликат (measureRef в MarqueeTitle): меряем singleW
  // на каждом пуше, НЕ трогая видимый бегунок — поэтому замер остаётся корректным
  // и после догрузки шрифта/смены масштаба. Видимый DOM/анимацию пересобираем
  // только когда реально изменился результат (step) — иначе частые пуши позиции
  // во время игры рвали бы анимацию рестартом в 0%. `force` — для resize.
  var _mq = { text:null, step:-1, measure:null };
  function updateMarquee(force){
    var wrap = $('titleWrap'), el = $('title');
    if (!wrap || !el) return;
    var m = _mq;
    var text = st.title || '—';
    // Замер (scrollWidth/clientWidth) — принудительный layout, а звали нас на
    // каждом пуше состояния. Текст тот же и ширины не менялись (все случаи смены
    // ширины зовут с force) — мерить нечего.
    if (!force && text === m.text) return;
    if (!m.measure) {
      m.measure = document.createElement('div');
      m.measure.className = 'title';
      m.measure.setAttribute('aria-hidden', 'true');
      m.measure.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;pointer-events:none';
      wrap.appendChild(m.measure);
    }
    m.measure.textContent = text;
    var singleW = m.measure.scrollWidth;
    var wrapW = wrap.clientWidth;
    // Режим оптимизации — без прокрутки (заголовок обрезается «…» через CSS).
    var step = (!perfMode && wrapW > 0 && singleW > wrapW + 4) ? singleW + 64 : 0;
    if (!force && text === m.text && step === m.step) return;
    m.text = text; m.step = step;
    wrap.classList.remove('scrolling');
    el.style.removeProperty('--ov-off');
    el.style.removeProperty('animation-duration');
    el.textContent = text;
    if (step > 0){
      var dur = Math.max(4, Math.round(step / 55));
      el.innerHTML = esc(text) +
        '<span aria-hidden="true" style="display:inline-block;min-width:64px"></span>' +
        esc(text);
      el.style.setProperty('--ov-off', '-' + step + 'px');
      el.style.setProperty('animation-duration', dur + 's');
      wrap.classList.add('scrolling');
    }
  }

  // Обложку пересобираем только при смене артворка: innerHTML с <img> на каждом
  // рендере заставлял вебвью пересоздавать и декодировать картинку.
  var _coverKey = null;
  function render(){
    renderArtist();
    updateMarquee();
    var tb = $('titleBar');
    if (tb && tb.textContent !== (st.title || '—')) tb.textContent = st.title || '—';
    var key = st.artwork || '';
    if (key !== _coverKey){
      _coverKey = key;
      var html = st.artwork
        ? '<img src="' + esc(st.artwork) + '" alt="">'
        : '<div class="cov-empty"><i></i></div>';
      $('cover').innerHTML = html;
      var bcov = $('barCover');
      if (bcov) bcov.innerHTML = html;
    }
    document.body.classList.toggle('paused', !st.playing);
    setPlayIcon();
    applyCoverColor();
    // Полосу трогаем, только если что-то реально сдвинулось: обычный пуш позиции
    // (раз в секунду) не должен перезапускать анимацию.
    if (progDirty) armProgress();
  }

  /** Плашка сейчас видна на экране (CSS-класс show ставят reveal/hide). */
  function islandShown(){
    var el = $('island');
    return !!el && el.classList.contains('show');
  }

  // Иконки пересобираем только на смену состояния: innerHTML со свежим SVG на
  // каждом пуше (раз в секунду, ×2 кнопки) — это парсинг и пересоздание узлов
  // ради того же самого рисунка.
  var _playIconKey = null;
  function setPlayIcon(){
    if (st.playing === _playIconKey) return;
    _playIconKey = st.playing;
    var html = st.playing
      ? '<path fill="none" stroke="currentColor" stroke-width="1.5" d="M2 6c0-1.886 0-2.828.586-3.414S4.114 2 6 2s2.828 0 3.414.586S10 4.114 10 6v12c0 1.886 0 2.828-.586 3.414S7.886 22 6 22s-2.828 0-3.414-.586S2 19.886 2 18zm12 0c0-1.886 0-2.828.586-3.414S16.114 2 18 2s2.828 0 3.414.586S22 4.114 22 6v12c0 1.886 0 2.828-.586 3.414S19.886 22 18 22s-2.828 0-3.414-.586S14 19.886 14 18z"/>'
      : '<path fill="none" stroke="currentColor" stroke-width="1.5" d="M20.409 9.353a2.998 2.998 0 0 1 0 5.294L7.597 21.614C5.534 22.737 3 21.277 3 18.968V5.033c0-2.31 2.534-3.769 4.597-2.648z"/>';
    var pi = $('ovPlayIcon');
    if (pi) pi.innerHTML = html;
    var pib = $('ovPlayIconBar');
    if (pib) pib.innerHTML = html;
  }

  // ── Прогресс трека ───────────────────────────────────────
  // Позицию НЕ докручиваем таймером: `st.pos` — якорь, снятый в момент `posAt`
  // (performance.now), текущая позиция считается из часов. Так она точна между
  // пушами, и её не нужно перерисовывать 4 раза в секунду.
  var posAt = 0;
  function setPos(p){ st.pos = p; posAt = performance.now(); progDirty = true; }
  function curPos(){
    if (!st.playing || st.dur <= 0) return st.pos;
    return Math.min(st.dur, st.pos + (performance.now() - posAt) / 1000);
  }

  // Заливку ведём ОДНОЙ длинной CSS-transition до конца трека (translateX,
  // linear): её крутит композитор, главный поток в кадре не участвует. Раньше
  // здесь была `width` с переходом .25s, который тикер перезапускал каждые 250мс
  // — то есть непрерывная layout-анимация на 60 fps, самая дорогая вещь в окне.
  // Взводим заново только когда что-то реально изменилось (progDirty): сик,
  // play/pause, смена трека, показ плашки, смена режима.
  var progDirty = true;
  var _fills = null;
  function fills(){
    if (!_fills) _fills = [$('progFill'), $('progFillBar')].filter(Boolean);
    return _fills;
  }
  function armProgress(){
    progDirty = false;
    var pos = curPos();
    var pct = st.dur > 0 ? Math.min(1, Math.max(0, pos / st.dur)) : 0;
    var els = fills();
    for (var i = 0; i < els.length; i++){
      els[i].style.transition = 'none';
      els[i].style.transform = 'translateX(' + (pct * 100 - 100).toFixed(3) + '%)';
    }
    // Скрытой плашке и во время скраба анимация не нужна (первая — впустую жгла бы
    // кадры, второй — тянется за курсором вручную).
    var left = st.dur - pos;
    if (!st.playing || scrubbing || left <= 0.05 || !islandShown()) return;
    // Один принудительный reflow на обе заливки — чтобы новая transition
    // стартовала от только что выставленной точки, а не от старой.
    void els[0].offsetWidth;
    for (var j = 0; j < els.length; j++){
      els[j].style.transition = 'transform ' + left.toFixed(2) + 's linear';
      els[j].style.transform = 'translateX(0%)';
    }
  }

  // Команда плееру (играть/пауза/пред/след) — через тот же мост, что мини-плеер.
  function cmd(c){
    try{ ti.invoke('miniplayer_cmd', { cmd: c, value: null }); }catch(e){}
  }
  // Перемотка: тот же мост, что у мини-плеера (Rust → bloom-mp-seek в main).
  function seek(pos){
    try{ ti.invoke('miniplayer_cmd', { cmd: 'seek', value: pos }); }catch(e){}
  }
  // Плашка показана/скрыта (Rust): пока показана, там крутится сторож курсора.
  function setInteractive(on){
    try{ ti.invoke('overlay_set_interactive', { interactive: on }); }catch(e){}
  }
  // Габарит видимой плашки внутри окна → Rust: по нему сторож решает, ловить
  // мышь или пропускать клики насквозь. Окно всегда больше плашки (поле под
  // тень, а в компакте — ещё и нераскрытая ширина), поэтому габарит и нужен.
  // Шлём сразу в физических пикселях (× DPR) — Rust работает в них.
  var hitRaf = 0;
  function reportHit(){
    if (hitRaf) return;
    hitRaf = requestAnimationFrame(function(){
      hitRaf = 0;
      var r = $('island').getBoundingClientRect();
      if (!r.width || !r.height) return;
      var d = window.devicePixelRatio || 1;
      try{
        ti.invoke('overlay_set_hit_rect',
          { x: r.left * d, y: r.top * d, w: r.width * d, h: r.height * d });
      }catch(e){}
    });
  }
  // Курсор зашёл на плашку / ушёл с неё. Зовётся и DOM-событиями, и сторожем
  // курсора (`bloom-ov-hit`): при уходе окно становится click-through, и штатный
  // mouseleave до вебвью может уже не дойти — авто-скрытие бы не перезапустилось.
  function onPillEnter(){
    if (hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
    // Компакт: после раскрытия (ширина обёртки выросла) пересчитываем бегущую строку.
    if (document.body.classList.contains('compact')){
      setTimeout(function(){ updateMarquee(true); }, 280);
    }
  }
  function onPillLeave(){
    if (pinned || !islandShown()) return;
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(hide, Math.max(1, duration) * 1000);
  }
  function update(s){
    if (!s) return;
    if (s.source   !== undefined) st.source   = s.source;
    if (s.title    !== undefined) st.title    = s.title;
    if (s.artist   !== undefined) st.artist   = s.artist;
    if (s.artwork  !== undefined) st.artwork  = s.artwork;
    // Перед сменой play/pause фиксируем позицию по часам — дальше она считается
    // от нового якоря (на паузе стоит, при игре едет).
    if (s.playing !== undefined && s.playing !== st.playing){
      setPos(curPos());
      st.playing = s.playing;
    }
    // Длительность — до позиции: от неё зависит и кламп `curPos`, и доля заливки.
    if (s.duration !== undefined && s.duration !== st.dur){ st.dur = s.duration; progDirty = true; }
    // Снап позиции при заметном расхождении (seek/смена трека); мелкий дрейф
    // игнорируем — позицию и так ведут часы (curPos), а перезапуск анимации
    // полосы на каждом пуше дёргал бы её.
    if (s.position !== undefined && !scrubbing && Math.abs(s.position - curPos()) > 1.2) setPos(s.position);
    // Плашка спрятана — состояние скопили, DOM не трогаем (reveal отрендерит).
    // Rust и так не пушит скрытой плашке, это страховка на гонки показа/скрытия.
    if (!islandShown()) return;
    render();
  }

  function setAnchorDir(anchor){
    // Направление выезда: верхние якоря — сверху, нижние — снизу.
    var from = (anchor && anchor.charAt(0) === 'b') ? '14px' : '-14px';
    document.documentElement.style.setProperty('--ov-from', from);
  }

  function reveal(asPinned){
    applyPrefs();
    if (hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
    $('island').classList.add('show');
    // Пока плашка была спрятана, пуши копились в st без рендера — дорисовываем.
    // Полосу взводим заново: пока плашка была скрыта, её анимация стояла.
    progDirty = true;
    render();
    // Стартуем «мимо плашки»: перехват мыши включит сторож, когда курсор реально
    // окажется над ней. В режиме размещения окно ловит мышь целиком.
    if (!document.body.classList.contains('placing')) document.body.classList.add('nohit');
    reportHit();
    setInteractive(true);
    // Закрепляем только по явному запросу (хоткей). Авто-показ при смене трека
    // (asPinned=false) НЕ снимает уже стоящее закрепление.
    if (asPinned) pinned = true;
    if (!pinned){
      hideTimer = setTimeout(hide, Math.max(1, duration) * 1000);
    }
  }
  function hide(){
    if (hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
    $('island').classList.remove('show');
    setInteractive(false);
    pinned = false;
    // Останавливаем CSS-анимацию полосы: невидимая, она всё равно жгла бы кадры.
    // Позиция при этом не теряется — она считается по часам (curPos).
    armProgress();
  }

  function start(){
    ti = window.__TAURI_INTERNALS__;
    // Отключаем браузерное контекстное меню вебвью (как в miniplayer/tray).
    window.addEventListener('contextmenu', function(e){ e.preventDefault(); }, false);
    applyTheme();
    applyPrefs();

    // Кнопки управления.
    $('btnPrev').addEventListener('click', function(){ cmd('prev'); });
    $('btnNext').addEventListener('click', function(){ cmd('next'); });
    // Оптимистично переключаем иконку, команду шлём в плеер.
    function togglePlay(){
      setPos(curPos());          // якорь до смены playing
      st.playing = !st.playing;
      document.body.classList.toggle('paused', !st.playing);
      setPlayIcon();
      armProgress();
      cmd('playpause');
    }
    $('btnPlay').addEventListener('click', togglePlay);
    var btnPlayBar = $('btnPlayBar');
    if (btnPlayBar) btnPlayBar.addEventListener('click', togglePlay);

    // Прогресс-бар: перемотка кликом/скрабом (если включена в настройках).
    // Логика как в мини-плеере: визуал ведём за курсором, аудио сикаем на ходу
    // (throttle) + финальный сик на отпускании; scrubbing гасит эхо-пуши.
    function attachSeek(track){
      if (!track) return;
      var dragging = false, last = 0, wheelTimer = null;
      function posFromEvent(e){
        var r = track.getBoundingClientRect();
        var ratio = (e.clientX - r.left) / r.width;
        ratio = Math.max(0, Math.min(1, ratio));
        return ratio * st.dur;
      }
      // Пока идёт скраб, armProgress не заводит длинную анимацию (scrubbing) —
      // заливка просто ставится в точку курсора.
      track.addEventListener('pointerdown', function(e){
        if (!seekEnabled || !st.dur) return;
        scrubbing = true; dragging = true;
        try{ track.setPointerCapture(e.pointerId); }catch(_){}
        setPos(posFromEvent(e)); armProgress(); seek(st.pos);
        last = Date.now(); e.preventDefault();
      });
      track.addEventListener('pointermove', function(e){
        if (!dragging || !st.dur) return;
        setPos(posFromEvent(e)); armProgress();
        var now = Date.now();
        if (now - last > 90){ last = now; seek(st.pos); }
      });
      function endScrub(e){
        if (!dragging) return;
        dragging = false; scrubbing = false;
        try{ track.releasePointerCapture(e.pointerId); }catch(_){}
        if (!st.dur) return;
        setPos(posFromEvent(e)); armProgress(); seek(st.pos);
      }
      track.addEventListener('pointerup', endScrub);
      track.addEventListener('pointercancel', endScrub);
      // Колесо над баром → перемотка ±1с.
      track.addEventListener('wheel', function(e){
        if (!seekEnabled || !st.dur) return;
        e.preventDefault();
        scrubbing = true;
        setPos(Math.max(0, Math.min(st.dur, curPos() + (e.deltaY < 0 ? 1 : -1))));
        armProgress(); seek(st.pos);
        if (wheelTimer) clearTimeout(wheelTimer);
        wheelTimer = setTimeout(function(){ scrubbing = false; armProgress(); }, 250);
      }, { passive:false });
    }
    attachSeek($('prog'));
    attachSeek($('barCenter'));

    // Клик по имени артиста → страница артиста в главном окне (как в мини-плеере).
    $('artist').addEventListener('click', function(e){
      var link = e.target.closest && e.target.closest('.tra-link');
      if (!link) return;
      var name = link.getAttribute('data-artist');
      if (!name) return;
      try{ ti.invoke('tray_open_artist', { artist: name }); }catch(err){}
    });

    // Пересчёт бегущей строки при смене размера окна (меняется масштаб оверлея).
    window.addEventListener('resize', function(){ updateMarquee(true); reportHit(); });

    // Наведение на плашку держит её открытой (как уведомление); увод — перезапуск
    // авто-скрытия (только если не закреплена).
    var island = $('island');
    island.addEventListener('mouseenter', onPillEnter);
    island.addEventListener('mouseleave', onPillLeave);

    // Прокрутка артистов — по ховеру всей плашки (как подписи карточек в
    // приложении). Старт с задержкой: в компакте ховер СНАЧАЛА раскрывает
    // плашку, и замер до конца анимации дал бы переполнение от узкой ширины,
    // т.е. строку увезло бы дальше, чем нужно.
    var artTimer = 0;
    island.addEventListener('mouseenter', function(){
      clearTimeout(artTimer);
      artTimer = setTimeout(artScrollStart, 260);
    });
    island.addEventListener('mouseleave', function(){
      clearTimeout(artTimer);
      artScrollStop();
    });

    // Габарит плашки меняется от ховера (раскрытие компакта), режима и масштаба —
    // каждый раз пересылаем его сторожу курсора. ResizeObserver ловит размер,
    // transitionend — конец выезда (там ещё живёт transform: scale).
    try{ new ResizeObserver(reportHit).observe(island); }catch(_){}
    island.addEventListener('transitionend', reportHit);

    // Режим ручного размещения: вся плашка — drag-ручка. OS-перетаскивание
    // (start_dragging) для этого окна не работает — оно no-activate (focus:false),
    // поэтому двигаем окно сами: считаем дельту мыши в экранных координатах и
    // шлём её в Rust. Capture-фаза — чтобы опередить обработчики кнопок/прогресса.
    (function(){
      var dragging = false, lastSX = 0, lastSY = 0;
      island.addEventListener('pointerdown', function(e){
        if (!document.body.classList.contains('placing')) return;
        e.preventDefault(); e.stopPropagation();
        dragging = true; lastSX = e.screenX; lastSY = e.screenY;
        try{ island.setPointerCapture(e.pointerId); }catch(_){}
      }, true);
      island.addEventListener('pointermove', function(e){
        if (!dragging) return;
        var dx = e.screenX - lastSX, dy = e.screenY - lastSY;
        if (!dx && !dy) return;
        lastSX = e.screenX; lastSY = e.screenY;
        try{ ti.invoke('overlay_drag_by', { dx: dx, dy: dy }); }catch(_){}
      }, true);
      function endDrag(e){
        if (!dragging) return;
        dragging = false;
        try{ island.releasePointerCapture(e.pointerId); }catch(_){}
      }
      island.addEventListener('pointerup', endDrag, true);
      island.addEventListener('pointercancel', endDrag, true);
    })();

    listenEvent('bloom-mp-state', function(p){ update(p); });
    // Сторож курсора: окно только что стало ловить мышь (курсор над плашкой) или
    // снова пропускает клики насквозь.
    listenEvent('bloom-ov-hit', function(over){
      if (document.body.classList.contains('placing')) return;
      document.body.classList.toggle('nohit', !over);
      if (over) onPillEnter(); else onPillLeave();
    });
    listenEvent('bloom-ov-place', function(p){
      var on = !!(p && p.on);
      document.body.classList.toggle('placing', on);
      if (on){
        document.body.classList.remove('nohit');  // окно ловит мышь целиком
        reveal(true);         // показать закреплённой, без авто-скрытия
      } else hide();
    });
    // Живые координаты (доли → %) во время перетаскивания.
    listenEvent('bloom-ov-placed', function(p){
      if (!p) return;
      var el = $('placeCoords');
      if (el) el.textContent = 'X ' + Math.round(p.x * 100) + '%  ·  Y ' + Math.round(p.y * 100) + '%';
    });
    listenEvent('bloom-ov-show', function(p){
      if (p && p.anchor) setAnchorDir(p.anchor);
      reveal(false);
    });
    listenEvent('bloom-ov-toggle', function(p){
      if (p && p.anchor) setAnchorDir(p.anchor);
      // Тогл: если плашка видна — прячем, иначе закрепляем без авто-скрытия.
      if ($('island').classList.contains('show')) hide();
      else reveal(true);
    });

    // Живое применение настроек/темы из главного окна.
    window.addEventListener('storage', function(e){
      if (e.key === 'bloom_view_prefs'){
        applyPrefs();
        // Сдвинули прозрачность/масштаб, пока плашка видна — обновляем сразу.
      } else if (e.key === 'bloom_settings'){
        applyTheme();
        applyComputed(); // цвет обложки приоритетнее темы, если посчитан
      }
    });

    // Стартовое состояние из кэша.
    try{
      ti.invoke('miniplayer_get_state').then(function(s){ if (s) update(s); }).catch(function(){});
    }catch(e){}
  }

  function waitForTauri(){
    if (window.__TAURI_INTERNALS__) start();
    else setTimeout(waitForTauri, 30);
  }
  waitForTauri();
})();
</script>
</body>
</html>
