<!doctype html>
<!-- Инлайн-фон на <html>: окно создаётся с transparent:true (нативная прозрачность),
     без него был бы кадр «дыры в стол» до загрузки CSS-бандла. При включённой
     нативной прозрачности его перебивает html.native-transparent (transparency.css). -->
<html lang="ru" style="background:#0a0a0a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom</title>
    <!-- Сплэш инлайном в <head>: рендерится мгновенно, ДО загрузки JS-бандла
         (иначе экран, ради которого он и нужен, ждал бы сам себя). main.tsx после
         монтирования React плавно гасит его и удаляет из DOM. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        /* Следует за фоном приложения (тема/кастомный фон). Фолбэк #0a0a0a —
           дефолт --bg на время до загрузки CSS-бандла, где переменная задаётся. */
        background: var(--bg, #0a0a0a);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 96px;
        height: 96px;
        opacity: 0.9;
        animation: splash-breathe 2.2s ease-in-out infinite;
        /* Логотип — не выделяемый и не перетаскиваемый: без этого его можно
           случайно выделить мышью (drag-select), как текст/картинку в браузере. */
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }
      /* Логотип белый: на светлой теме он сливается с фоном. Инвертируем —
         альфа-канал фильтр не трогает, поэтому звезда просто становится чёрной.
         Класс ставит инлайн-скрипт ниже (до бандла), потом его же переставляет
         themeStore.applyToRoot. */
      html.theme-light #splash img {
        filter: invert(1);
      }
      @keyframes splash-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.09);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
          opacity: 0.9;
        }
      }
    </style>
    <!-- Применяем сохранённый цвет фона (--bg) ДО загрузки бандла, чтобы сплэш
         (background:var(--bg)) сразу совпадал с темой, а не мигал дефолтом. Бандл
         позже переустановит то же значение. Источник — localStorage['bloom_theme']. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('bloom_theme') || '{}')
        if (typeof t.bg === 'string' && t.bg) document.documentElement.style.setProperty('--bg', t.bg)
        // Светлая поверхность — тем же правилом, что и в themeStore (isLightSurface):
        // сначала цвет блоков, --bg лишь запасной сигнал. Нужно уже здесь, иначе
        // белый логотип сплэша тонет в белом фоне до загрузки бандла.
        var lum = function (hex) {
          var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex || '').trim())
          if (!m) return null
          return (0.299 * parseInt(m[1], 16) + 0.587 * parseInt(m[2], 16) + 0.114 * parseInt(m[3], 16)) / 255
        }
        var l = lum(t.blockColor)
        if (l === null) l = lum(t.bg)
        if (l !== null && l > 0.6) document.documentElement.classList.add('theme-light')
      } catch (e) {}
      // Гасим браузерное контекстное меню сразу: одноимённый обработчик в main.tsx
      // вешается лишь после загрузки бандла, поэтому во время сплэша правый клик
      // иначе открывал бы нативное меню WebView2.
      window.addEventListener('contextmenu', function (e) {
        e.preventDefault()
      })
    </script>
  </head>
  <body>
    <div id="splash"><img src="/logo.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
