<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Bloom PiP</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
:root{
  /* Вес шрифта — копия --fw-bold из src/shared/styles/root.css
     (окно отдельное, стили главного окна сюда не попадают). Меняешь там — меняй тут. */
  --fw-bold:500;
  --bg:#1a1a1a;--bg2:#242424;--border:rgba(255,255,255,.08);
  --accent:#fff;--accent2:#e5e5e5;--accent-rgb:255,255,255;--accent-text:#000;
  --text:#fff;--text2:#9a9a9a;--muted:#5a5a5a;
  --font:-apple-system,'SF Pro Display','SF Pro Text','Segoe UI','Roboto',system-ui,sans-serif;
  --radius:14px;
}
html,body{
  width:100%;height:100%;overflow:hidden;position:relative;
  font-family:var(--font);-webkit-font-smoothing:antialiased;
  background:#000;color:var(--text);
}

/* ── Titlebar (same as main app, now floats over cover) ─ */
#winTitlebar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  height:32px;display:flex;align-items:center;gap:8px;
  padding:0 0 0 12px;
  user-select:none;-webkit-user-select:none;
  background:linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0));
}
#winDrag{
  flex:1;height:100%;display:flex;align-items:center;gap:8px;
  cursor:grab;overflow:hidden;min-width:0;
}
#winDrag:active{cursor:grabbing}
.win-icon{
  width:16px;height:16px;flex-shrink:0;pointer-events:none;
  background-color:currentColor;color:rgba(255,255,255,.72);
  -webkit-mask-image:url('/logo.png');mask-image:url('/logo.png');
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
}
.win-title{
  font-size:12px;font-weight:var(--fw-bold);color:rgba(255,255,255,.8);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;min-width:0;
}
.win-btns{display:flex;align-items:center;margin-left:auto;flex-shrink:0}
.win-btn{
  width:46px;height:32px;border:none;background:transparent;
  color:rgba(255,255,255,.72);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;flex-shrink:0;
}
/* Ряд без плашек — как `.win-btn` в главном окне (soundcloud-system.css):
   отклик даёт только подсветка иконки, у закрытия краснеет сама иконка. */
.win-btn:hover{background:none;color:var(--text)}
.win-btn.on{color:var(--accent)}
.win-close:hover{background:none!important;color:#e5484d!important}

/* ── Cover fills the whole window ──────────────────── */
.cover{
  position:absolute;inset:0;z-index:0;
  background:var(--bg2);overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}

/* ── Scrim — затемнение только при наведении (читаемость кнопок/тайтлбара) ── */
.scrim{
  position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;
  transition:opacity .2s;
  background:linear-gradient(to bottom,
    rgba(0,0,0,.45) 0%, rgba(0,0,0,.05) 26%,
    rgba(0,0,0,.05) 42%, rgba(0,0,0,.72) 100%);
}
body:hover .scrim{opacity:1}

/* ── Track info — по центру поверх обложки, всегда видно ── */
.info-center{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:52px 22px 72px;text-align:center;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
body:hover .info-center{transform:translateY(-16px)}
.info-text{
  width:100%;min-width:0;display:flex;flex-direction:column;
  align-items:center;gap:3px;
}
.title-wrap{
  max-width:100%;width:100%;overflow:hidden;
  display:flex;justify-content:center;
}
.title{
  font-size:17px;font-weight:var(--fw-bold);color:#fff;letter-spacing:-.01em;
  white-space:nowrap;cursor:pointer;transition:color .12s;
  display:inline-block;pointer-events:auto;
  text-shadow:0 1px 3px rgba(0,0,0,.55);
}
.title:hover{color:var(--accent)}
@keyframes mp-marquee{0%{transform:translateX(0)}100%{transform:translateX(var(--mp-off,0))}}
.title-wrap.scrolling{justify-content:flex-start}
.title-wrap.scrolling .title{animation:mp-marquee linear infinite;will-change:transform}
.title-wrap.scrolling:hover .title{animation-play-state:paused}
.artist{
  max-width:100%;font-size:13px;color:rgba(255,255,255,.82);pointer-events:auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}
/* Hover-marquee строки артистов — порт `useCardMarquee` из приложения: клип
   (.artist) стоит на месте, внутренний бегунок в покое `inline` (иначе не
   работает многоточие), пока курсор в окне — `inline-block` и катится на
   величину переполнения. Кадры — копия `trscroll` из animations.css. */
@keyframes pip-artscroll{0%,10%{transform:translateX(0)}80%,100%{transform:translateX(var(--tr-off,0))}}
.artist>.mq-in{display:inline}
.tra-link{cursor:pointer;transition:color .1s}
.tra-link:hover{color:#fff;text-decoration:underline}

/* ── Hover UI — прогресс/кнопки/громкость, появляются при наведении ── */
.hover-ui{
  position:absolute;left:0;right:0;bottom:0;z-index:4;
  padding:0 12px 8px;
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(10px);
  transition:opacity .18s,transform .18s;
}
body:hover .hover-ui{opacity:1;transform:none}

/* ── Toast ─────────────────────────────────────────── */
.toast{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:var(--text);
  font-size:11px;font-weight:var(--fw-bold);
  padding:6px 12px;border-radius:calc(var(--radius)*0.5);
  pointer-events:none;opacity:0;transition:opacity .18s;
  z-index:50;white-space:nowrap;
}
.toast.show{opacity:1}

/* ── Add popup (перенесён с главного окна: #cxPlFlyout + .ci из
   search-misc.css) ──────────────────────────────────────────────────
   Строки плоские: ни у пункта, ни у бокса иконки нет подложки — отклик
   только цветом (--ovl .78 → 1, здесь белым по обложке). Плейлист —
   двухэтажная строка: 28px обложка + название и счётчик треков. */
@keyframes apIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.add-popup{
  position:fixed;z-index:100;
  background:color-mix(in srgb, var(--bg2) 50%, #000 50%);
  border:none;
  border-radius:calc(var(--radius) * 0.9);
  padding:5px;min-width:185px;max-width:240px;
  box-shadow:none;
  display:none;max-height:320px;overflow-y:auto;
}
/* Со списком плейлистов (крупные обложки) нужно больше ширины — иначе
   названию остаётся ~80px. */
.add-popup:has(.ci-pl){min-width:218px;max-width:260px}
.add-popup.open{display:block;animation:apIn .16s cubic-bezier(.2,.9,.3,1)}
.ci{
  padding:5px 10px;font-size:13px;cursor:pointer;
  border-radius:calc(var(--radius) * 0.5);
  display:flex;align-items:center;gap:10px;
  color:rgba(255,255,255,.78);transition:color .1s;
  white-space:nowrap;
}
.ci:hover{color:#fff}
.ci-icon{
  width:18px;height:18px;border-radius:5px;background:transparent;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:inherit;overflow:hidden;
}
.ci-icon svg{width:15px;height:15px}
.ci.accent{color:var(--accent);font-weight:var(--fw-bold)}
.ci.ci-pl{padding:4px 8px;gap:10px}
.ci.ci-pl .ci-icon{width:28px;height:28px;border-radius:calc(var(--radius) * 0.4)}
.ci-pl-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.25}
.ci-pl-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-pl-sub{font-size:11px;color:var(--text2);opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Заглушка без обложки (как shared/ui/EmptyCover.tsx): подложка + знак bloom.
   Одна на всех: и пустой плейлист в попапе «Добавить», и трек без артворка. */
.pl-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)}
.pl-empty i{display:block;width:34%;height:34%;min-width:10px;min-height:10px;flex-shrink:0;background-color:var(--text);opacity:.16;-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat}
/* Коллаж из обложек первых треков (как shared/ui/PlaylistCover.tsx). */
.pl-grid{display:grid;width:100%;height:100%;overflow:hidden}
.pl-grid img,.pl-one{width:100%;height:100%;object-fit:cover;display:block}
.cx-sep{height:1px;background:rgba(255,255,255,.08);margin:3px;opacity:.65}

/* ── Progress ─────────────────────────────────────── */
.prog-wrap{margin-bottom:4px;flex-shrink:0}
.prog-track{
  height:3px;background:rgba(255,255,255,.28);
  border-radius:2px;cursor:pointer;position:relative;
}
.prog-fill{
  position:absolute;left:0;top:0;height:100%;
  background:var(--accent);border-radius:2px;
  pointer-events:none;transition:width .08s linear;
}
.prog-times{
  display:flex;justify-content:space-between;
  font-size:10px;color:rgba(255,255,255,.7);
  font-variant-numeric:tabular-nums;
  margin-top:5px;
  text-shadow:0 1px 4px rgba(0,0,0,.5);
}
.prog-times .cur{color:#fff}

/* ── Controls ─────────────────────────────────────── */
.ctrl{
  display:flex;align-items:center;justify-content:center;gap:2px;
  padding:4px 0;flex-shrink:0;
}
.cc{
  width:34px;height:34px;border-radius:calc(var(--radius)*0.7);
  background:none;border:none;color:rgba(255,255,255,.82);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;position:relative;
}
.cc:hover{color:#fff}
.cc.on{color:var(--accent)}
/* Активный тогл под курсором не белеет (как в осн. окне): цвет остаётся
   акцентным, отклик — лёгкая подсветка. */
.cc.on:hover{color:var(--accent);filter:brightness(1.15)}
.cc.fav.on:hover{color:#e03030;filter:brightness(1.15)}
.cc.fav.on{color:#e03030}
/* Бейджи режимов (перенесены с главного окна, .cc-badge в player.css):
   кружок акцентного цвета сверху справа над кнопкой — «умная» перемешка
   (звёздочка), повтор очереди (список) и повтор трека (цифра 1). Точку под
   активным тоглом они заменяют: в приложении её нет, включённость видна по
   акцентному цвету иконки. Смещение 3px — кнопка тут 34px против 30px в
   плеере, без него кружок отрывался бы от иконки. */
.cc-badge{
  position:absolute;top:3px;right:3px;width:13px;height:13px;
  border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  line-height:1;color:var(--accent-text);pointer-events:none;
  font-size:8px;font-weight:var(--fw-bold);
  box-shadow:0 1px 3px rgba(0,0,0,.3);
  animation:cc-badge-pop .18s ease-out;
}
@keyframes cc-badge-pop{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cc-badge{animation:none}}
/* Цифра оптически сидит выше центра — компенсируем отступом сверху. */
.cc-badge.num{padding-top:1px}
.cc-play{
  width:44px;height:44px;border-radius:calc(var(--radius)*0.85);
  background:var(--accent);border:none;color:var(--accent-text);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .12s,transform .08s;
  margin:0 4px;
}
.cc-play:hover{background:var(--accent2)}
.cc-play:active{transform:scale(.94)}
/* Плоская кнопка play: без фона + крупная иконка, как в осн. окне. Ведёт себя как .cc. */
body.play-flat .cc-play{width:38px;height:38px;border-radius:calc(var(--radius)*0.7);background:none;color:#fff}
body.play-flat .cc-play:hover{color:#fff}
body.play-flat .cc-play svg{width:22px;height:22px}

/* ── Volume ───────────────────────────────────────── */
.vol{
  display:flex;align-items:center;gap:8px;
  padding:6px 4px 2px;flex-shrink:0;
}
.vol-btn{
  width:28px;height:28px;border:none;background:transparent;
  color:rgba(255,255,255,.82);cursor:pointer;border-radius:calc(var(--radius)*0.4);
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;flex-shrink:0;
}
.vol-btn:hover{color:#fff}
.vol-sl{
  -webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;
  background:rgba(255,255,255,.28);outline:none;cursor:pointer;
}
.vol-sl::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:11px;height:11px;
  border-radius:50%;background:var(--text);cursor:pointer;
}
.vol-num{
  font-size:10px;color:rgba(255,255,255,.7);
  font-variant-numeric:tabular-nums;
  min-width:26px;text-align:right;
  text-shadow:0 1px 4px rgba(0,0,0,.5);
}

    /* ===== КОНТРАКТ ОТРИСОВКИ ИКОНОК =====
       То же, что `[data-ico]` в base.css главного окна, но окно отдельное:
       React-реестра здесь нет, иконки вписаны сырыми <svg>, поэтому вес не
       считается, а задан таблицей по размеру. Формула та же:
       sw = clamp(1.5, 27.6/размер, 2.2) — цель 1.15px штриха на экране.
       Зашитые в иконку 1.5 при 12px давали 0.63px, то есть субпиксельную кашу.

       Ограничено 24-й сеткой: бренд-логотипы живут на своих viewBox и под
       правило не попадают. svg со СВОИМ stroke-width — это голые «+»/«×»,
       нарисованные вручную, их вес выверен отдельно. */
    svg[viewBox="0 0 24 24"]:not([stroke-width]):not([data-ink]),
    svg[viewBox="0 0 24 24"]:not([stroke-width]):not([data-ink]) *{stroke-width:var(--ico-sw,1.5);stroke-linecap:round;stroke-linejoin:round}
    /* Залитые контуры Solar (сердце, shuffle, repeat): толщина запечена в
       координатах, stroke-width по ним не работает — вес добирается тонкой
       обводкой ПОВЕРХ заливки. */
    svg[viewBox="0 0 24 24"][data-ink="filled"]{stroke:currentColor;stroke-width:var(--ico-ink,0);stroke-linejoin:round}
    svg[viewBox="0 0 24 24"][width="9"]{--ico-sw:2.2;--ico-ink:.7}
    svg[viewBox="0 0 24 24"][width="12"]{--ico-sw:2.2;--ico-ink:.7}
    svg[viewBox="0 0 24 24"][width="13"]{--ico-sw:2.12;--ico-ink:.62}
    svg[viewBox="0 0 24 24"][width="14"]{--ico-sw:1.97;--ico-ink:.47}
    svg[viewBox="0 0 24 24"][width="15"]{--ico-sw:1.84;--ico-ink:.34}
    svg[viewBox="0 0 24 24"][width="16"]{--ico-sw:1.72;--ico-ink:.22}
    svg[viewBox="0 0 24 24"][width="17"]{--ico-sw:1.62;--ico-ink:.12}
    svg[viewBox="0 0 24 24"][width="18"]{--ico-sw:1.53;--ico-ink:.03}
  </style>
</head>
<body>

<!-- Titlebar -->
<div id="winTitlebar">
  <div id="winDrag">
    <span class="win-icon"></span>
    <span class="win-title" id="winTitleText">Bloom</span>
  </div>
  <div class="win-btns">
    <button class="win-btn on" id="pinBtn">
      <svg data-ink="filled" width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="m19.184 7.805l-2.965-2.967c-2.027-2.03-3.04-3.043-4.129-2.803s-1.581 1.587-2.568 4.28l-.668 1.823c-.263.718-.395 1.077-.632 1.355a2 2 0 0 1-.36.332c-.296.213-.664.314-1.4.517c-1.66.458-2.491.687-2.804 1.23a1.53 1.53 0 0 0-.204.773c.004.627.613 1.236 1.83 2.455L6.7 16.216l-4.476 4.48a.764.764 0 0 0 1.08 1.08l4.475-4.48l1.466 1.468c1.226 1.226 1.839 1.84 2.47 1.84c.265 0 .526-.068.757-.2c.548-.313.778-1.149 1.239-2.822c.202-.735.303-1.102.515-1.399q.14-.194.322-.352c.275-.238.632-.372 1.345-.64l1.844-.693c2.664-1 3.996-1.501 4.23-2.586c.235-1.086-.77-2.093-2.783-4.107"/></svg>
    </button>
    <button class="win-btn" id="openMainBtn">
      <svg width="13" height="13" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"><path stroke-linejoin="round" d="m13 11l9-9m0 0h-5.344M22 2v5.344"/><path d="M22 12c0 4.714 0 7.071-1.465 8.535C19.072 22 16.714 22 12 22s-7.071 0-8.536-1.465C2 19.072 2 16.714 2 12s0-7.071 1.464-8.536C4.93 2 7.286 2 12 2"/></g></svg>
    </button>
    <button class="win-btn win-close" id="closeBtn">
      <svg width="10" height="10" viewBox="0 0 10 10">
        <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/>
        <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
  </div>
</div>

<!-- Full-window cover (background) -->
<div class="cover" id="tCover">
  <svg width="28" height="28" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 19a3 3 0 1 1-6 0a3 3 0 0 1 6 0Zm12-2a3 3 0 1 1-6 0a3 3 0 0 1 6 0ZM9 19V8m12 9V6"/><path stroke-linecap="round" d="m15.735 3.755l-4 1.333c-1.32.44-1.98.66-2.357 1.184S9 7.492 9 8.882V12l12-4v-.45c0-2.533 0-3.8-.83-4.398c-.831-.599-2.032-.198-4.435.603Z"/></g></svg>
</div>

<!-- Hover scrim (darkens for legibility) -->
<div class="scrim"></div>

<!-- Centered title / artist (always visible over the cover) -->
<div class="info-center">
  <div class="info-text">
    <div class="title-wrap"><div class="title" id="tTitle"></div></div>
    <div class="artist" id="tArtist">—</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="add-popup" id="addPopup"></div>

<!-- Hover controls: progress + transport + volume -->
<div class="hover-ui">

  <!-- Progress -->
  <div class="prog-wrap">
    <div class="prog-track" id="progTrack">
      <div class="prog-fill" id="progFill" style="width:0%"></div>
    </div>
    <div class="prog-times">
      <span class="cur" id="tPos">0:00</span>
      <span id="tDur">0:00</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="ctrl">
    <button class="cc fav" id="btnFav" onclick="cmd('fav')">

<script>
(function(){
  'use strict';

  window.addEventListener('contextmenu', function(e){ e.preventDefault(); }, false);

  // ── i18n (standalone — зеркалит ключи player.* из dict.ts, локаль из localStorage) ──
  var I18N = {
    ru: { notSelected:'Не выбрано', copied:'Скопировано', copyError:'Ошибка', toLib:'В библиотеку', createPl:'Создать плейлист', newPl:'Новый плейлист' },
    en: { notSelected:'Nothing selected', copied:'Copied', copyError:'Error', toLib:'Add to library', createPl:'Create playlist', newPl:'New playlist' }
  };
  var LOCALE = 'en';
  function readLocale() {
    try { var _l = localStorage.getItem('bloom_locale'); if (_l === 'ru' || _l === 'en') LOCALE = _l; } catch(e) {}
  }
  readLocale();
  function tr(k) { return (I18N[LOCALE] && I18N[LOCALE][k]) || I18N.en[k] || k; }
  // Живое переключение: перечитываем локаль и переприменяем видимые строки.
  // Окно не перезагружается (создаётся раз, прячется/показывается), поэтому
  // ловим смену языка через storage-событие, state-пуш и фокус.
  function refreshLocale() {
    var prev = LOCALE;
    readLocale();
    document.documentElement.lang = LOCALE;
    if (prev !== LOCALE) {
      var tt = document.getElementById('tTitle');
      if (tt && !st.title) tt.textContent = tr('notSelected');
    }
  }

  var ti = null;
  var st = { playing:false, pos:0, dur:0, title:'', artist:'', artwork:'', shuffle:false, smartShuffle:false, repeat:0, volume:80, fav:false, canAddToLib:false, source:null };

  var ticker = null;
  var prevVol = 80;
  var showTrackInTitle = false;
  var alwaysOnTop = true;
  var scrubbing = false;   // блок пушей/тикера (drag ИЛИ колесо) — st.pos не трогаем
  var dragging = false;    // зажат указатель на баре (только drag — для pointermove)
  var scrubLast = 0;       // троттлинг live-сика во время перетаскивания
  // Окно видимо (Rust шлёт bloom-win-vis на show/hide). Пока скрыто — состояние
  // копим в st без DOM-работы и глушим тикер; при показе рендерим разом.
  var winVisible = true;
  var needRender = false;

  function readTitlebarPref() {
    try { showTrackInTitle = localStorage.getItem('bloom_changeTitlebar') === 'true'; } catch(e) {}
  }
  function applyWinTitle() {
    var el = document.getElementById('winTitleText');
    if (!el) return;
    if (showTrackInTitle && st.title) {
      el.textContent = st.artist ? st.title + ' — ' + st.artist : st.title;
    } else {
      el.textContent = 'Bloom';
    }
  }

  function invoke(c, a) {
    try { return ti.invoke(c, a || {}); } catch(e) { console.warn('[mp] invoke', c, e); }
  }
  // target = метка окна, а не 'Any': слушатель с 'Any' принимает и адресные
  // emit_to() в ДРУГИЕ окна (см. tauri match_any_or_filter). Broadcast app.emit()
  // помеченный слушатель по-прежнему получает.
  function listenEvent(event, fn) {
    try {
      var hid = ti.transformCallback(function(e) { fn(e.payload); });
      invoke('plugin:event|listen', { event: event, target: { kind: 'AnyLabel', label: 'miniplayer' }, handler: hid });
    } catch(e) { console.warn('[mp] listen', event, e); }
  }

  function fmt(s) {
    if (!s || !isFinite(s)) return '0:00';
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function parseArtists(s) {
    if (!s) return [];
    return String(s).split(/\s*(?:,|;|&|feat\.?|ft\.?|x|×|with|и)\s+/i)
      .map(function(p){ return p.trim(); })
      .filter(function(p){ return p.length > 0; });
  }

  function renderArtist(artist) {
    var el = document.getElementById('tArtist');
    var parts = artist ? parseArtists(artist) : [];
    var html = parts.length
      ? parts.map(function(a){
          return '<span class="tra-link" data-artist="' + esc(a) + '">' + esc(a) + '</span>';
        }).join(', ')
      : '—';
    // Бегунок .mq-in — обёртка для hover-marquee (см. artScroll ниже).
    el.innerHTML = '<span class="mq-in">' + html + '</span>';
    // Курсор мог остаться в окне (трек сменился сам) — тогда сразу катим новую
    // строку, иначе она замерла бы до следующего захода.
    if (document.body.matches(':hover')) artScrollStart(); else artScrollStop();
  }

  // Прокрутка не влезшей строки артистов, пока курсор в окне. Пересчитываем на
  // каждом заходе, а не при рендере: окно PiP свободно тянется мышью.
  var ART_DURATION = 5, ART_MIN_OVERFLOW = 2;
  function artScrollStart() {
    var clip = document.getElementById('tArtist'), inner = clip && clip.firstElementChild;
    if (!inner) return;
    var overflow = clip.scrollWidth - clip.clientWidth;
    if (overflow <= ART_MIN_OVERFLOW) return;
    // Строка центрированная: на время прокрутки прижимаем к левому краю, иначе
    // текст стартует «из-под» левой границы клипа.
    clip.style.textAlign = 'left';
    inner.style.display = 'inline-block';
    inner.style.willChange = 'transform';
    inner.style.setProperty('--tr-off', '-' + overflow + 'px');
    inner.style.animation = 'pip-artscroll ' + ART_DURATION + 's linear infinite';
  }
  function artScrollStop() {
    var clip = document.getElementById('tArtist'), inner = clip && clip.firstElementChild;
    if (!inner) return;
    clip.style.textAlign = '';
    inner.style.animation = '';
    inner.style.transform = 'translateX(0)';
    inner.style.display = ''; // → inline, многоточие снова работает
    inner.style.willChange = '';
    inner.style.removeProperty('--tr-off');
  }

  var toastTimer = null;
  function showToast(text) {
    var t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1300);
  }

  function setPlayIcon(playing) {
    document.getElementById('playIcon').innerHTML = playing
      ? '<path fill="none" stroke="currentColor" stroke-width="1.5" d="M2 6c0-1.886 0-2.828.586-3.414S4.114 2 6 2s2.828 0 3.414.586S10 4.114 10 6v12c0 1.886 0 2.828-.586 3.414S7.886 22 6 22s-2.828 0-3.414-.586S2 19.886 2 18zm12 0c0-1.886 0-2.828.586-3.414S16.114 2 18 2s2.828 0 3.414.586S22 4.114 22 6v12c0 1.886 0 2.828-.586 3.414S19.886 22 18 22s-2.828 0-3.414-.586S14 19.886 14 18z"/>'
      : '<path fill="none" stroke="currentColor" stroke-width="1.5" d="M20.409 9.353a2.998 2.998 0 0 1 0 5.294L7.597 21.614C5.534 22.737 3 21.277 3 18.968V5.033c0-2.31 2.534-3.769 4.597-2.648z"/>';
  }

  function setProgress(pos, dur) {
    st.pos = pos; st.dur = dur;
    var pct = dur > 0 ? Math.min(100, pos / dur * 100) : 0;
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('tPos').textContent = fmt(pos);
    document.getElementById('tDur').textContent = dur > 0 ? fmt(dur) : '0:00';
  }

  function startTicker() {
    if (ticker) return;
    // 250мс/+0.25 вместо 1с/+1 — бар движется плавно (4 шага/сек), как в плеере,
    // а не «тикает» раз в секунду.
    ticker = setInterval(function() {
      if (!st.playing || st.dur <= 0 || scrubbing) return;
      st.pos = Math.min(st.pos + 0.25, st.dur);
      setProgress(st.pos, st.dur);
    }, 250);
  }
  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

  var VOL_LOUD = '<g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.535 10.971c.073-1.208.11-1.813.424-2.394a3.2 3.2 0 0 1 1.38-1.3C3.94 7 4.627 7 6 7c.512 0 .768 0 1.016-.042a3 3 0 0 0 .712-.214c.23-.101.444-.242.871-.524l.22-.144C11.36 4.399 12.632 3.56 13.7 3.925c.205.07.403.17.58.295c.922.648.993 2.157 1.133 5.174A68 68 0 0 1 15.5 12c0 .532-.035 1.488-.087 2.605c-.14 3.018-.21 4.526-1.133 5.175a2.3 2.3 0 0 1-.58.295c-1.067.364-2.339-.474-4.882-2.151L8.6 17.78c-.427-.282-.64-.423-.871-.525a3 3 0 0 0-.712-.213C6.768 17 6.512 17 6 17c-1.374 0-2.06 0-2.66-.277a3.2 3.2 0 0 1-1.381-1.3c-.314-.582-.35-1.186-.424-2.395A17 17 0 0 1 1.5 12c0-.323.013-.671.035-1.029Z"/><path stroke-linecap="round" d="M20 6s1.5 1.8 1.5 6s-1.5 6-1.5 6m-2-9s.5.9.5 3s-.5 3-.5 3"/></g>';
  var VOL_MUTED = '<path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" d="M16.659 6c-.14-.798-.37-1.315-.792-1.628a2.1 2.1 0 0 0-.538-.29c-.992-.357-2.172.465-4.533 2.11l-.204.14c-.397.277-.595.415-.809.515a2.7 2.7 0 0 1-.66.21c-.231.04-.469.04-.944.04c-1.276 0-1.914 0-2.47.272c-.509.249-1.017.754-1.283 1.275c-.291.57-.325 1.162-.394 2.348c-.02.35-.032.692-.032 1.008s.012.658.032 1.008c.069 1.186.103 1.778.394 2.348c.266.521.774 1.026 1.282 1.275c.557.272 1.195.272 2.47.272c.476 0 .714 0 .944.04q.343.062.661.21c.214.1.412.238.81.514l.203.142c2.36 1.644 3.542 2.466 4.533 2.109c.19-.069.374-.168.538-.29c.422-.313.652-.83.792-1.628M20 9l-6 6m0-6l6 6"/>';
  var HEART_LINEAR = '<path fill="currentColor" d="m8.962 18.91l.464-.588zM12 5.5l-.54.52a.75.75 0 0 0 1.08 0zm3.038 13.41l.465.59zm-5.612-.588C7.91 17.127 6.253 15.96 4.938 14.48C3.65 13.028 2.75 11.335 2.75 9.137h-1.5c0 2.666 1.11 4.7 2.567 6.339c1.43 1.61 3.254 2.9 4.68 4.024zM2.75 9.137c0-2.15 1.215-3.954 2.874-4.713c1.612-.737 3.778-.541 5.836 1.597l1.08-1.04C10.1 2.444 7.264 2.025 5 3.06C2.786 4.073 1.25 6.425 1.25 9.137zM8.497 19.5c.513.404 1.063.834 1.62 1.16s1.193.59 1.883.59v-1.5c-.31 0-.674-.12-1.126-.385c-.453-.264-.922-.628-1.448-1.043zm7.006 0c1.426-1.125 3.25-2.413 4.68-4.024c1.457-1.64 2.567-3.673 2.567-6.339h-1.5c0 2.198-.9 3.891-2.188 5.343c-1.315 1.48-2.972 2.647-4.488 3.842zM22.75 9.137c0-2.712-1.535-5.064-3.75-6.077c-2.264-1.035-5.098-.616-7.54 1.92l1.08 1.04c2.058-2.137 4.224-2.333 5.836-1.596c1.659.759 2.874 2.562 2.874 4.713zm-8.176 9.185c-.526.415-.995.779-1.448 1.043s-.816.385-1.126.385v1.5c.69 0 1.326-.265 1.883-.59c.558-.326 1.107-.756 1.62-1.16z"/>';
  var HEART_BOLD = '<path fill="currentColor" d="M2 9.137C2 14 6.02 16.591 8.962 18.911C10 19.729 11 20.5 12 20.5s2-.77 3.038-1.59C17.981 16.592 22 14 22 9.138S16.5.825 12 5.501C7.5.825 2 4.274 2 9.137"/>';

  // Бесшовный marquee как в основном плеере (MarqueeTitle): две копии текста с
  // зазором, сдвиг на (ширина+зазор); зазор 64px, скорость 55 px/с.
  // Замер через скрытый дубликат (measureRef в MarqueeTitle): меряем singleW
  // на каждом пуше, НЕ трогая видимый бегунок — поэтому замер остаётся корректным
  // и после догрузки шрифта/смены раскладки. Видимый DOM/анимацию пересобираем
  // только когда реально изменился результат (step) — иначе частые пуши позиции
  // во время игры рвали бы анимацию рестартом в 0%. `force` — для resize.
  var _mqText = null, _mqStep = -1, _mqMeasure = null;
  function updateMarquee(force) {
    var wrap = document.querySelector('.title-wrap');
    var el = document.getElementById('tTitle');

    var text = st.title || tr('notSelected');
    if (!_mqMeasure) {
      _mqMeasure = document.createElement('div');
      _mqMeasure.className = 'title';
      _mqMeasure.setAttribute('aria-hidden', 'true');
      _mqMeasure.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;pointer-events:none';
      wrap.appendChild(_mqMeasure);
    }
    _mqMeasure.textContent = text;
    var singleW = _mqMeasure.scrollWidth;
    var wrapW = wrap.offsetWidth;
    var step = singleW > wrapW + 4 ? singleW + 64 : 0;
    if (!force && text === _mqText && step === _mqStep) return;
    _mqText = text; _mqStep = step;
    wrap.classList.remove('scrolling');
    el.style.removeProperty('--mp-off');
    el.style.removeProperty('animation-duration');
    el.textContent = text;
    if (step > 0) {

        '<span aria-hidden="true" style="display:inline-block;min-width:64px"></span>' +

    // даёт «дёрганье»/откат бара назад. Во время скраба пуши не трогают бар.
    if (s.position !== undefined && !scrubbing && Math.abs(s.position - st.pos) > 1.2) st.pos = s.position;
    if (s.duration !== undefined) st.dur     = s.duration;
    if (s.shuffle  !== undefined) st.shuffle = s.shuffle;

  // ── Add popup ─────────────────────────────────────
  function getPlaylists() {
    try { return JSON.parse(localStorage.getItem('bloom_playlists') || '[]'); } catch(e) { return []; }
  }
  // Обложки треков для коллажа берём из `bloom_cover_cache` — того же LS-кеша
  // «id трека → URL обложки», что кормит коллажи на главной. Реестра площадок и
  // библиотеки в этом окне нет, так что это единственный доступный источник:
  // чего в кеше не нашлось — просто не попадёт в коллаж.
  var _ccRaw = null, _ccMap = {};
  function coverCache() {
    var raw = null;
    try { raw = localStorage.getItem('bloom_cover_cache'); } catch(e) {}
    if (raw === _ccRaw) return _ccMap;
    _ccRaw = raw; _ccMap = {};
    try {
      var arr = JSON.parse(raw || '[]');
      if (Array.isArray(arr)) {
        for (var i = 0; i < arr.length; i++) {
          var e = arr[i];
          if (Array.isArray(e) && typeof e[0] === 'string' && typeof e[1] === 'string') _ccMap[e[0]] = e[1];
        }
      }
    } catch(e) { _ccMap = {}; }
    return _ccMap;
  }
  // Первые до 4 РАЗНЫХ обложек в порядке плейлиста (дубли отсеиваем: у альбома
  // все треки с одной картинкой, сетка из её копий выглядела бы поломанной).
  function plCovers(trs) {
    var cc = coverCache(), out = [];
    for (var i = 0; i < (trs || []).length && out.length < 4; i++) {
      var c = cc[trs[i]];
      if (c && out.indexOf(c) < 0) out.push(c);
    }
    return out;
  }
  // Коллаж как в shared/ui/PlaylistCover.tsx: 1 → на всю площадь, 2 → две
  // половины, 3 → большая слева + две справа, 4 → сетка 2×2.
  function collageHTML(covers) {
    if (covers.length === 1) return '<img class="pl-one" src="' + esc(covers[0]) + '" alt="">';
    var rows = covers.length === 2 ? '1fr' : '1fr 1fr';
    var h = '<span class="pl-grid" style="grid-template-columns:1fr 1fr;grid-template-rows:' + rows + '">';
    for (var i = 0; i < covers.length; i++) {
      h += '<img src="' + esc(covers[i]) + '" alt=""' +
        (covers.length === 3 && i === 0 ? ' style="grid-row:span 2"' : '') + '>';
    }
    return h + '</span>';
  }
  // Своя обложка → коллаж из обложек треков → заглушка (EmptyCover.tsx).
  function plIconHTML(pl) {
    var inner;
    if (pl.cover) {
      inner = '<img class="pl-one" src="' + esc(pl.cover) + '" alt="">';
    } else {
      var cs = plCovers(pl.trs);
      inner = cs.length ? collageHTML(cs) : '<span class="pl-empty"><i></i></span>';
    }
    return '<span class="ci-icon">' + inner + '</span>';
  }
  // Склонение счётчика треков (tracksLabel из features/library/lib/formatCount).
  function tracksLabel(n) {
    if (LOCALE !== 'ru') return n + (n === 1 ? ' track' : ' tracks');
    var abs = Math.abs(n) % 100, last = abs % 10;
    if (abs >= 11 && abs <= 14) return n + ' треков';
    if (last === 1) return n + ' трек';
    if (last >= 2 && last <= 4) return n + ' трека';
    return n + ' треков';
  }

    // какой вес штриха возьмёт таблица в <style> — поэтому он тоже 15.
    var ICON_DL  = '<svg width="15" height="15" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15c0 2.828 0 4.243.879 5.121C4.757 21 6.172 21 9 21h6c2.828 0 4.243 0 5.121-.879C21 19.243 21 17.828 21 15M12 3v13m0 0l4-4.375M12 16l-4-4.375"/></svg>';
    var ICON_PL  = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    if (st.canAddToLib) {
      html += '<div class="ci accent" data-act="lib"><span class="ci-icon">' + ICON_DL + '</span>' + tr('toLib') + '</div>';
      if (pls.length) html += '<div class="cx-sep"></div>';
    }
    if (!pls.length) {
      html += '<div class="ci" data-act="new"><span class="ci-icon">' + ICON_PL + '</span>' + tr('createPl') + '</div>';
    } else {
      pls.forEach(function(pl) {
        html += '<div class="ci ci-pl" data-act="pl" data-id="' + esc(pl.id) + '">' + plIconHTML(pl) +
          '<span class="ci-pl-txt">' +
            '<span class="ci-pl-name">' + esc(pl.name) + '</span>' +
            '<span class="ci-pl-sub">' + esc(tracksLabel((pl.trs || []).length)) + '</span>' +

      });
      html += '<div class="cx-sep"></div><div class="ci" data-act="new"><span class="ci-icon">' + ICON_PL + '</span>' + tr('newPl') + '</div>';

    var btn = document.getElementById('btnAdd');
    var r = btn.getBoundingClientRect();
    var pw = p.offsetWidth, ph = p.offsetHeight;
    // + — крайняя правая кнопка: правый край попапа равняем по правому краю
    // кнопки (висит влево-вверх от неё). Центрирование тут «отрывает» попап от
    // кнопки и налезает на громкость.
    var left = r.right - pw;
    var top  = r.top - ph - 6;
    if (left + pw > window.innerWidth - 6) left = window.innerWidth - pw - 6;

    if (top < 6) top = r.bottom + 6;
    if (top + ph > window.innerHeight - 6) top = window.innerHeight - ph - 6;
    if (top < 6) top = 6;

  function onAddPopupClick(e) {

  function applySettings(s) {
    if (!s) return;
    var r = document.documentElement;
    if (s.accent) {
      var hex = s.accent.replace(/\s/g, '');
      r.style.setProperty('--accent', hex);
      var m = hex.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
      if (m) {
        var R = parseInt(m[1],16), G = parseInt(m[2],16), B = parseInt(m[3],16);
        r.style.setProperty('--accent-rgb', R+','+G+','+B);
        var lum = 0.2126*(R/255) + 0.7152*(G/255) + 0.0722*(B/255);
        r.style.setProperty('--accent-text', lum > 0.4 ? '#000' : '#fff');
      }
    }
    if (s.accent2) r.style.setProperty('--accent2', s.accent2);
    if (s.radius)  r.style.setProperty('--radius', s.radius);
    if (typeof s.blockR === 'number' && typeof s.blockG === 'number' && typeof s.blockB === 'number') {
      r.style.setProperty('--bg',  'rgb(' + s.blockR + ',' + s.blockG + ',' + s.blockB + ')');
      var l = function(c){ return Math.min(255, Math.round(c + (255-c)*0.06)); };
      r.style.setProperty('--bg2', 'rgb(' + l(s.blockR) + ',' + l(s.blockG) + ',' + l(s.blockB) + ')');
    }
  }
  function loadSettings() {
    try { applySettings(JSON.parse(localStorage.getItem('bloom_settings') || '{}')); } catch(e) {}

  // Плоская кнопка play (без фона, крупная иконка) — всегда включена.
  function applyPlayBtnBg() {
    document.body.classList.add('play-flat');

  window.cmd = function(c) {
    if (c === 'fav') {
      st.fav = !st.fav;
      setFavIcon(st.fav);
      invoke('miniplayer_cmd', { cmd: 'fav', value: null });
      return;
    }
    if (c === 'add') { toggleAddPopup(); return; }
    if (c === 'mute') {
      var cur = parseInt(document.getElementById('volSl').value);
      if (cur > 0) { prevVol = cur; window.onVol(0); }
      else { window.onVol(prevVol || 80); }
      return;
    }
    if (c === 'playpause') {
      st.playing = !st.playing;
      setPlayIcon(st.playing);
      if (st.playing) startTicker(); else stopTicker();
    }
    // Кнопка перемешки в приложении — цикл из ТРЁХ состояний
    // (`cycleShuffle`: выкл → обычная → умная), а не тогл: мгновенный отклик
    // повторяем тем же циклом, иначе на переходе «обычная → умная» кнопка
    // на миг гасла бы. Настоящее состояние всё равно придёт пушем.
    if (c === 'shuffle') {
      if (!st.shuffle) { st.shuffle = true; st.smartShuffle = false; }
      else if (!st.smartShuffle) { st.smartShuffle = true; }
      else { st.shuffle = false; st.smartShuffle = false; }
      renderToggles();
    }
    if (c === 'repeat') {
      st.repeat = (st.repeat + 1) % 3;
      renderToggles();
    }
    invoke('miniplayer_cmd', { cmd: c, value: null });
  };

  function start() {
    ti = window.__TAURI_INTERNALS__;
    document.documentElement.lang = LOCALE;
    document.getElementById('tTitle').textContent = tr('notSelected');
    loadSettings();
    applyPlayBtnBg();
    readTitlebarPref();
    applyWinTitle();

    // Drag titlebar
    document.getElementById('winDrag').addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      invoke('plugin:window|start_dragging');
    });

    document.getElementById('closeBtn').addEventListener('click', function() {
      invoke('close_miniplayer');
    });
    document.getElementById('pinBtn').addEventListener('click', togglePin);
    document.getElementById('openMainBtn').addEventListener('click', function() {
      invoke('open_main_window');
    });

    // Add-popup wiring
    document.getElementById('addPopup').addEventListener('click', onAddPopupClick);
    document.addEventListener('click', function(e) {
      var p = document.getElementById('addPopup');
      if (!p.classList.contains('open')) return;
      if (p.contains(e.target)) return;
      if (e.target.closest && e.target.closest('#btnAdd')) return;
      closeAddPopup();
    });

    // Re-evaluate marquee on resize
    window.addEventListener('resize', function() { updateMarquee(true); artScrollStop(); });

    // Прокрутка артистов — пока курсор в окне (тем же жестом, что показывает
    // hover-UI). Ховерить саму строку не заставляем: она узкая и стоит поверх
    // обложки, а окно PiP и так целиком «карточка».
    document.body.addEventListener('mouseenter', artScrollStart);
    document.body.addEventListener('mouseleave', artScrollStop);

    // Click title → copy "title — artist"
    document.getElementById('tTitle').addEventListener('click', function() {
      if (!st.title) return;
      var text = st.title + (st.artist ? ' — ' + st.artist : '');
      var ok = function() { showToast(tr('copied')); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(function(){ showToast(tr('copyError')); });
      }
    });

    // Click artist chip → open artist page in main window
    document.getElementById('tArtist').addEventListener('click', function(e) {
      var link = e.target.closest && e.target.closest('.tra-link');
      if (!link) return;
      var name = link.getAttribute('data-artist');
      if (!name) return;
      invoke('tray_open_artist', { artist: name });
    });

    // Прогресс-бар: полноценный скраб (как в плеере). Визуал ведёт за курсором,
    // аудио сикается на ходу (throttled) + финальный сик на отпускании.
    (function(){
      var track = document.getElementById('progTrack');
      var fill = document.getElementById('progFill');
      function posFromEvent(e) {
        var r = track.getBoundingClientRect();
        var ratio = (e.clientX - r.left) / r.width;
        ratio = Math.max(0, Math.min(1, ratio));
        return ratio * st.dur;
      }
      track.addEventListener('pointerdown', function(e) {
        if (!st.dur) return;
        scrubbing = true;
        dragging = true;
        // Снимаем width-transition — иначе заливка «доезжает» за 80мс и тянется
        // с задержкой за курсором (в плеере её нет).
        if (fill) fill.style.transition = 'none';
        try { track.setPointerCapture(e.pointerId); } catch(_) {}
        var pos = posFromEvent(e);
        setProgress(pos, st.dur);
        invoke('miniplayer_cmd', { cmd: 'seek', value: pos });
        scrubLast = Date.now();
        e.preventDefault();
      });
      track.addEventListener('pointermove', function(e) {
        if (!dragging || !st.dur) return;
        var pos = posFromEvent(e);
        setProgress(pos, st.dur);
        var now = Date.now();
        if (now - scrubLast > 90) { scrubLast = now; invoke('miniplayer_cmd', { cmd: 'seek', value: pos }); }
      });
      function endScrub(e) {
        if (!dragging) return;
        dragging = false;
        scrubbing = false;
        if (fill) fill.style.transition = '';   // вернуть плавность для авто-движения
        try { track.releasePointerCapture(e.pointerId); } catch(_) {}
        if (!st.dur) return;
        var pos = posFromEvent(e);
        setProgress(pos, st.dur);
        invoke('miniplayer_cmd', { cmd: 'seek', value: pos });
      }
      track.addEventListener('pointerup', endScrub);
      track.addEventListener('pointercancel', endScrub);

      // Колесо над прогресс-баром → перемотка ±1с, сик сразу
      // (onProgWheel плеера). Короткий scrubbing-блок (250мс после последнего щелчка)
      // гасит эхо bloom-mp-state, чтобы бар не откатывало.
      var wheelTimer = null;
      track.addEventListener('wheel', function(e) {
        if (!st.dur) return;
        e.preventDefault();
        scrubbing = true;
        st.pos = Math.max(0, Math.min(st.dur, st.pos + (e.deltaY < 0 ? 1 : -1)));
        setProgress(st.pos, st.dur);
        invoke('miniplayer_cmd', { cmd: 'seek', value: st.pos });
        if (wheelTimer) clearTimeout(wheelTimer);
        wheelTimer = setTimeout(function(){ scrubbing = false; }, 250);
      }, { passive: false });
    })();

    // Wheel over volume row → ±1
    document.querySelector('.vol').addEventListener('wheel', function(e) {
      e.preventDefault();
      var v = Math.min(100, Math.max(0, st.volume + (e.deltaY < 0 ? 1 : -1)));
      window.onVol(v);
    }, { passive: false });

    window.addEventListener('storage', function(e) {
      if (e.key === 'bloom_settings') {
        try { applySettings(JSON.parse(e.newValue || '{}')); } catch(e2) {}
      } else if (e.key === 'bloom_changeTitlebar') {
        readTitlebarPref();
        applyWinTitle();
      } else if (e.key === 'bloom_locale') {
        refreshLocale();
      }
    });
    window.addEventListener('focus', refreshLocale);

    // Показ/скрытие окна (шлёт Rust): скрыто → глушим тикер, при показе
    // дорисовываем накопленное состояние.
    listenEvent('bloom-win-vis', function(v) {
      winVisible = !!v;
      if (!winVisible) { stopTicker(); return; }
      if (needRender) renderAll();
      else if (st.playing) startTicker();
    });

    listenEvent('bloom-mp-state',    function(p) { updateUI(p); });
    listenEvent('bloom-mp-accent',   function(c) { if (c) document.documentElement.style.setProperty('--accent', c); });
    listenEvent('bloom-mp-settings', function(p) { applySettings(p); });
    listenEvent('bloom-mp-volume',   function(v) {
      v = parseInt(v);
      if (!isFinite(v)) return;
      st.volume = v;
      var sl = document.getElementById('volSl'); if (sl) sl.value = v;
      var nm = document.getElementById('volNum'); if (nm) nm.textContent = v;
      updateVolumeIcon(v);
    });

    invoke('miniplayer_get_state').then(function(s) { if (s) updateUI(s); }).catch(function() {});
  }

  function waitForTauri() {
    if (window.__TAURI_INTERNALS__) start();
    else setTimeout(waitForTauri, 30);
  }
  waitForTauri();
})();
</script>
</body>
</html>
